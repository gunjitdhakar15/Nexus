name: Release

# Deploys the app for free via GitHub Releases.
# Trigger: someone pushes a tag like "v1.0.0" (git tag v1.0.0 && git push origin v1.0.0)
on:
  push:
    tags:
      - 'v*'  # any tag starting with 'v'

# Create a release with permission to upload the built app
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest  # must build on Windows to make a Windows app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # NSIS is no longer preinstalled on GitHub's Windows runners.
      # Without it, wails silently skips the installer, so install it first.
      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      # -nsis builds BOTH Nexus.exe and a Nexus-amd64-installer.exe setup file.
      - name: Build app + installer
        run: wails build -platform windows/amd64 -nsis

      # Sanity check: show what was actually produced
      - name: List build output
        shell: bash
        run: ls -la build/bin/

      # Turn the tag name (e.g. "v1.0.0") into the release title (strip the 'v')
      - name: Compute release version
        shell: bash
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Publish to a GitHub Release page. Anyone can download from there.
      # The glob picks up the installer regardless of its exact name.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus ${{ steps.version.outputs.tag }}
          draft: false
          files: |
            build/bin/Nexus.exe
            build/bin/*installer*.exe
